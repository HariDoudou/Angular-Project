<mat-card class="list-card">
  <mat-card-header>
    <mat-card-title>{{ list.title }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div
      class="task-container"
      cdkDropList
      [cdkDropListData]="(tasks$ | async) || []"
      (cdkDropListDropped)="onDrop($event)">
      <app-task-item
        *ngFor="let task of tasks$ | async"
        [task]="task">
      </app-task-item>

      <div *ngIf="(tasks$ | async)?.length === 0" class="empty-list">
        Aucune tâche
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <div *ngIf="!showAddTask; else addTaskForm">
      <button mat-button color="primary" (click)="toggleAddTask()">
        <mat-icon>add</mat-icon> Ajouter une tâche
      </button>
    </div>

    <ng-template #addTaskForm>
      <app-task-form
        [listId]="list.id"
        (taskSubmitted)="handleAddTask($event)"
        (cancelled)="toggleAddTask()">
      </app-task-form>
    </ng-template>
  </mat-card-actions>
</mat-card>
